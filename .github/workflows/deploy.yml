# Builds the site and publishes dist/ to the gh-pages branch, which GitHub Pages
# serves at sands.madebysadegh.work (public/CNAME is copied into the build).
#
# Needs four repository variables (Settings > Secrets and variables > Actions > Variables):
# VUE_APP_EMAILJS_PUBLIC_KEY, VUE_APP_EMAILJS_SERVICE_ID, VUE_APP_EMAILJS_TEMPLATE_ID and
# VUE_APP_RECAPTCHA_SITE_KEY. They end up in the public JavaScript anyway, so they're
# variables rather than secrets. The build stops if any is missing (see vue.config.js).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push replaces one that's still waiting
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: write # push to the gh-pages branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit hashes so a moved tag can't change what runs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit

      - run: npm run build
        env:
          VUE_APP_EMAILJS_PUBLIC_KEY: ${{ vars.VUE_APP_EMAILJS_PUBLIC_KEY }}
          VUE_APP_EMAILJS_SERVICE_ID: ${{ vars.VUE_APP_EMAILJS_SERVICE_ID }}
          VUE_APP_EMAILJS_TEMPLATE_ID: ${{ vars.VUE_APP_EMAILJS_TEMPLATE_ID }}
          VUE_APP_RECAPTCHA_SITE_KEY: ${{ vars.VUE_APP_RECAPTCHA_SITE_KEY }}

      # Replaces the branch contents with dist/ (clearing old files) and adds .nojekyll
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
